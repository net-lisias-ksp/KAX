// ** Ground **

@PART[KAXheavyGear]:NEEDS[KSPWheel]:FOR[KAX] // GT-580 Heavy Gear Assembly for KAX >= 2.8.1.0
{
	-MODULE[FSwheel],* {}
	-MODULE[FSpartTurner],* {}

	EFFECTS
	{
		deploy
		{
			AUDIO
			{
				channel = Ship
				clip = Squad/Sounds/elev_start
				volume = 0 0
				volume = 1 0.5
				pitch = 0.75
			}
			AUDIO_LOOP
			{
				channel = Ship
				clip = Squad/Sounds/elev_loop
				volume = 0 0
				volume = 1 0.5
				pitch = 0.75
			}
		}
		deployed
		{
			AUDIO
			{
				channel = Ship
				clip = Squad/Sounds/elev_stop
				volume = 0 0
				volume = 1 0.5
				pitch = 0.75
			}
		}
		retract
		{
			AUDIO
			{
				channel = Ship
				clip = Squad/Sounds/elev_start
				volume = 0 0
				volume = 1 0.5
				pitch = 0.75
			}
			AUDIO_LOOP
			{
				channel = Ship
				clip = Squad/Sounds/elev_loop
				volume = 0 0
				volume = 1 0.5
				pitch = 0.75
			}
		}
		retracted
		{
			AUDIO
			{
				channel = Ship
				clip = Squad/Sounds/elev_stop
				volume = 0 0
				volume = 1 0.5
				pitch = 1.0
			}
		}
	}

	MODULE
	{
		name = KSPWheelBase
		wheelColliderName = WheelCollider
		wheelColliderOffset = 0
		wheelRadius = 0.100
		wheelMass = 0.1
		suspensionTravel = 1.25
		maxLoadRating = 250
		groundHeightOffset = 4
	}

	MODULE
	{
		name = KSPWheelSuspension
		suspensionName = Suspension
		suspensionOffset = 0
		suspensionAxis = 0, 1, 0
		retractedPosition = 0
		allowLockedSuspension = true
	}

	MODULE
	{
		name = KSPWheelBrakes
		maxBrakeTorque = 100
		brakesLocked = true
	}

	MODULE
	{
		name = KSPWheelDeployment
		animationName = EmptyProxyAnimation
		tempColliderName = Suspension
		tempColliderOffset = 0
		tempColliderAxis = 0,1,0
		retractEffect = retract
		retractedEffect = retracted
		deployEffect = deploy
		deployedEffect = deployed
	}

	MODULE
	{
		name = KSPWheelAdjustableDeployment
		controlName = Extension Length
		useDeployModule = true
		TRANSFORM
		{
			transformName = ExtensionPiston
			localPosition = 0,0,-1.25
		}
	}

	MODULE
	{
		name = KSPWheelAdjustableDeployment
		controlName = Deploy Angle
		useDeployModule = true
		TRANSFORM
		{
			transformName = BaseStructure
			localRotation = 0, 25, 0
		}
		//TODO really this should be the Bogey module, if I ever got that thing working?
		TRANSFORM
		{
			transformName = Foot
			localRotation = 0, -25, 0
		}
	}

	MODULE
	{
		name = KSPWheelDamage
	}

	MODULE
	{
		name = KSPWheelConstraints
		CONSTRAINT
		{
			mover = PistonTop
			target = PistonBottom
			type = LOOKLOCK
			mainAxis = 0,0,1
			secAxis = 0,1,0
		}
		CONSTRAINT
		{
			mover = PistonBottom
			target = PistonTop
			type = LOOKLOCK
			mainAxis = 0,0,1
			secAxis = 0,1,0
		}
	}
}
